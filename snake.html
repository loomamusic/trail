<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden; /* Disables both vertical and horizontal scrolling */
            }

        </style>
    </head>
    <body>
        <canvas id="mainCanvas"></canvas>
        <script>
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight

            let requestId;
            let hue;

            let oldPosX = Math.random() * canvas.width;
            let oldPosY = Math.random() * canvas.height;

            let newPosX = Math.random() * canvas.width;
            let newPosY = Math.random() * canvas.height;
            let radius = 20;
            let glideTime = 2;
            let iteration = 5;
            let frameRate = 60 * iteration;
            let glidePoint = glideTime * frameRate;
            let colorSpeed = 0.01;


            let oldLerpX = (newPosX - oldPosX)/(frameRate * glideTime);
            let oldLerpY = (newPosY - oldPosY)/(frameRate * glideTime);

            let newLerpX;
            let newLerpY;

            let lerpLerpX = (newLerpX - oldLerpX)/(frameRate * glideTime);
            let lerpLerpY = (newLerpY - oldLerpY)/(frameRate * glideTime);
            let tailLength = 5000; //How long the tail is.
            let tailCoef = -10; //Tail size modifier. Positive = shrinks over time (default), negative = grows. Magnitude scales size.
            
            let posX = [];
            let posY = [];
            let color = [];
            
            function loop(timestamp) {
                onresize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                ctx.fillStyle = "rgb(0,0,0)";
                ctx.fillRect(0,0,canvas.width,canvas.height);

                for (let i = 0; i < iteration; i++) {

                    if (hue < 360) {
                        hue+= colorSpeed;
                    }
                    else {
                        hue = 0;
                    }

                    if (glidePoint == glideTime * frameRate) {
                        glidePoint = 0;
                        newPosX = Math.random() * canvas.width;
                        newPosY = Math.random() * canvas.height;
                        newLerpX = (newPosX - oldPosX)/(frameRate * glideTime);
                        newLerpY = (newPosY - oldPosY)/(frameRate * glideTime);
                        lerpLerpX = (newLerpX - oldLerpX)/(frameRate * glideTime);
                        lerpLerpY = (newLerpY - oldLerpY)/(frameRate * glideTime);
                    }
                    else {
                        glidePoint++;
                        oldLerpX += lerpLerpX;
                        oldLerpY += lerpLerpY;
                        oldPosX += oldLerpX;
                        oldPosY += oldLerpY;
                    } 
                    posX.push(oldPosX);
                    posY.push(oldPosY);
                    color.push(hue);
                }
                while (posX.length > tailLength) { 
                    posX.shift();
                    posY.shift();
                    color.shift();
                }

                for (let i = 0; i < posX.length - 1; i++) {
                    let rainbow = `hsl(${color[i]}, 100%, ${50 * (i/tailLength)}%)`;
                    ctx.fillStyle = rainbow;
                    posX[i]-= (posX[i] - (canvas.width/2))/700;
                    posY[i]-= (posY[i] - (canvas.height/2))/700;


                    ctx.beginPath();
                    let age = 1 - i / tailLength; // 0 = newest, 1 = oldest
                    let radius = Math.max(0, 80 * (1 - tailCoef * age)); // head is always 80
                    ctx.arc(posX[i], posY[i], radius, 0, 2 * Math.PI);
                    ctx.fill(); 
                }
                requestId = requestAnimationFrame(loop);
            }

            requestId = requestAnimationFrame(loop);
        </script>
    </body>
</html>
